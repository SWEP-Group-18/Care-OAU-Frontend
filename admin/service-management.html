<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Management | Care-OAU</title>
  <meta name="description" content="Configure hospital clinical services, operating schedules, referral prerequisites, and daily intake quotas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layouts.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="app-layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" role="navigation" aria-label="Staff Navigation"></aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <header class="top-header"></header>

    <main class="content-container">
      
      <!-- PAGE HEADER -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
        <div>
          <h2 class="h2">Healthcare Service Management</h2>
          <p class="text-sm text-secondary">
            Manage clinical offerings, active operating schedules, and referral prerequisites across hospital units.
          </p>
        </div>
        <button type="button" class="btn btn-teal" id="btn-add-service">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add New Clinical Service
        </button>
      </div>

      <div class="service-admin-grid" id="services-tbody"></div>
    </main>
  </div>

  <!-- ADD / EDIT SERVICE MODAL DIALOG -->
  <div class="modal-backdrop" id="service-form-modal">
    <div class="modal" role="dialog" aria-modal="true" style="max-width: 640px;">
      <div class="modal-header">
        <h3 class="modal-title" id="service-modal-title">Configure Clinical Service</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-service" novalidate>
          <input type="hidden" id="service-id">

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label for="service-name" class="form-label">Service Title <span class="required">*</span></label>
              <input type="text" id="service-name" class="form-control" placeholder="e.g. Dental Care & Surgery" required>
              <div class="form-error"></div>
            </div>

            <div class="form-group">
              <label for="service-category" class="form-label">Clinic Category <span class="required">*</span></label>
              <select id="service-category" class="form-control" required>
                <option value="General Outpatient">General Outpatient</option>
                <option value="Specialist Clinic">Specialist Clinic</option>
                <option value="Diagnostics">Diagnostics & Laboratory</option>
                <option value="Mental Wellness">Mental Wellness & Counselling</option>
                <option value="Preventive Healthcare">Preventive Healthcare & Immunization</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="service-description" class="form-label">Scope Description <span class="required">*</span></label>
            <textarea id="service-description" class="form-control" rows="2" placeholder="Summary of clinical procedures and patient eligibility..." required></textarea>
            <div class="form-error"></div>
          </div>

          <!-- MONDAY-SUNDAY MULTI-SELECT DROPDOWN GROUP -->
          <div class="form-group">
            <label class="form-label">Operating Days (Monday – Sunday) <span class="required">*</span></label>
            <div id="service-day-selector-container"></div>
            <div id="service-days-error" class="form-error"></div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="form-group">
              <label for="service-start-time" class="form-label">Start Time <span class="required">*</span></label>
              <input type="time" id="service-start-time" class="form-control" value="08:00" required>
            </div>

            <div class="form-group">
              <label for="service-end-time" class="form-label">End Time <span class="required">*</span></label>
              <input type="time" id="service-end-time" class="form-control" value="18:00" required>
            </div>

            <div class="form-group">
              <label for="service-capacity" class="form-label">Daily Capacity Limit <span class="required">*</span></label>
              <input type="number" id="service-capacity" class="form-control" min="5" max="300" value="50" required>
            </div>
          </div>

          <div class="form-group" style="margin-top: var(--space-2);">
            <label style="display: flex; align-items: center; gap: 8px; font-size: var(--font-size-xs); cursor: pointer;">
              <input type="checkbox" id="service-referral" style="accent-color: var(--color-teal); width: 16px; height: 16px;">
              <strong>Requires Medical Officer Referral</strong> (e.g. Diagnostic Lab or Surgical Consultation)
            </label>
          </div>

          <div class="modal-footer" style="padding-left: 0; padding-right: 0; margin-top: var(--space-4);">
            <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
            <button type="submit" class="btn btn-teal" id="btn-save-service">Save Clinical Service</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/admin/services.js"></script>
</body>
</html>
