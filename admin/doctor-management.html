<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Scheduling & Capacity Management | Care-OAU</title>
  <meta name="description" content="Configure medical officer rosters, daily consultation capacity limits, working days and clinic availability.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layouts.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="app-layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" role="navigation" aria-label="Staff Navigation"></aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <header class="top-header"></header>

    <main class="content-container">
      
      <!-- PAGE HEADER -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
        <div>
          <h2 class="h2">Doctor Scheduling & Capacity Controls</h2>
          <p class="text-sm text-secondary">
            Set duty rosters, operating hours, and daily patient intake quotas to prevent physician overload.
          </p>
        </div>
        <button type="button" class="btn btn-teal" id="btn-add-doctor">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add New Physician
        </button>
      </div>

      <!-- FILTER CONTROLS BAR -->
      <div class="filter-bar">
        <!-- SEARCH -->
        <div class="input-with-icon" style="max-width: 320px; width: 100%;">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <input type="text" id="admin-doc-search" class="form-control" placeholder="Search doctor by name...">
        </div>

        <!-- DAY OF WEEK FILTER -->
        <div class="tab-filters" id="admin-day-tabs" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
          <button type="button" class="tab-filter-btn active" data-day="All">All Days</button>
          <button type="button" class="tab-filter-btn" data-day="Monday">Mon</button>
          <button type="button" class="tab-filter-btn" data-day="Tuesday">Tue</button>
          <button type="button" class="tab-filter-btn" data-day="Wednesday">Wed</button>
          <button type="button" class="tab-filter-btn" data-day="Thursday">Thu</button>
          <button type="button" class="tab-filter-btn" data-day="Friday">Fri</button>
          <button type="button" class="tab-filter-btn" data-day="Saturday">Sat</button>
        </div>
      </div>

      <!-- DOCTOR MANAGEMENT TABLE -->
      <div class="card">
        <div class="card-body" style="padding: 0;">
          <div class="management-list" id="doctors-manage-tbody"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- ADD / EDIT DOCTOR MODAL DIALOG -->
  <div class="modal-backdrop" id="doctor-form-modal">
    <div class="modal" role="dialog" aria-modal="true" style="max-width: 620px;">
      <div class="modal-header">
        <h3 class="modal-title" id="doctor-modal-title">Configure Physician Schedule</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-doctor" novalidate>
          <input type="hidden" id="doc-id">

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label for="doc-name" class="form-label">Doctor Name <span class="required">*</span></label>
              <input type="text" id="doc-name" class="form-control" placeholder="e.g. Dr. K. O. Adeleke" required>
              <div class="form-error"></div>
            </div>

            <div class="form-group">
              <label for="doc-title" class="form-label">Professional Title <span class="required">*</span></label>
              <input type="text" id="doc-title" class="form-control" placeholder="e.g. Senior Medical Officer" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="doc-service" class="form-label">Primary Service Department <span class="required">*</span></label>
            <select id="doc-service" class="form-control" required>
              <!-- Populated dynamically -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Duty Working Days <span class="required">*</span></label>
            <div id="doctor-day-selector-container"></div>
            <div id="doc-days-error" class="form-error"></div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="form-group">
              <label for="doc-start-time" class="form-label">Start Time <span class="required">*</span></label>
              <input type="time" id="doc-start-time" class="form-control" value="08:00" required>
            </div>

            <div class="form-group">
              <label for="doc-end-time" class="form-label">End Time <span class="required">*</span></label>
              <input type="time" id="doc-end-time" class="form-control" value="16:00" required>
            </div>

            <div class="form-group">
              <label for="doc-capacity" class="form-label">Daily Patient Limit <span class="required">*</span></label>
              <input type="number" id="doc-capacity" class="form-control" min="5" max="100" value="25" required>
            </div>
          </div>

          <div class="form-group">
            <label for="doc-room" class="form-label">Consulting Room</label>
            <input type="text" id="doc-room" class="form-control" placeholder="e.g. Consulting Room 3">
          </div>

          <div class="modal-footer" style="padding-left: 0; padding-right: 0; margin-top: var(--space-4);">
            <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
            <button type="submit" class="btn btn-teal" id="btn-save-doctor">Save Schedule & Capacity</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/admin/doctors.js"></script>
</body>
</html>
