<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care-OAU | Verify Email Address</title>
  <meta name="description" content="Verify your student email address for Care-OAU Health Centre Portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="auth-page-centered">

  <div class="auth-card compact">
    <div style="display: flex; justify-content: center; margin-bottom: 12px;">
      <a href="../index.html" class="logo" style="text-decoration: none;">
        <span class="logo-mark">
          <img src="../assets/images/oau-logo.png" alt="Obafemi Awolowo University logo" class="brand-crest-img">
        </span>
        <span>
          <strong>Care-OAU</strong>
          <small>Your Health. Your Time. Our Care.</small>
        </span>
      </a>
    </div>

    <div class="auth-heading" style="text-align: center;">
      <span class="eyebrow">Account verification</span>
      <h2>Verify your email</h2>
      <p id="verify-email-text">Enter the 6-digit confirmation code sent to your email.</p>
    </div>


    <form id="form-verify-email" novalidate>
      <div class="otp-container" id="otp-inputs">
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autofocus required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
      </div>

      <div id="otp-error" class="inline-error" style="display: none; margin-bottom: 14px;"></div>

      <button type="submit" class="button button-primary full" id="btn-verify-submit">
        Verify & Continue
      </button>

      <div class="resend-box">
        <span>Didn't get a code?</span>
        <button type="button" class="text-button" id="btn-resend-otp">
          Resend code (<span id="resend-countdown">30</span>s)
        </button>
      </div>
    </form>

    <div class="portal-link">
      Wrong email address? <a href="auth.html?mode=register" class="text-button">Return to Registration</a>
    </div>
  </div>

  <script type="module" src="../assets/js/student/verify-email.js"></script>
</body>
</html>
