<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care-OAU | Reset Password Request</title>
  <meta name="description" content="Request password recovery for Care-OAU Student Portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="auth-page-centered">

  <div class="auth-card compact">
    <div style="display: flex; justify-content: center; margin-bottom: 12px;">
      <a href="../index.html" class="logo" style="text-decoration: none;">
        <span class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true" class="brand-symbol">
            <path d="M27.5 11.5a11 11 0 1 0 0 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 20h4l2.1-4 3.2 8 2.1-4H30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>
          <strong>Care-OAU</strong>
          <small>Your Health. Your Time. Our Care.</small>
        </span>
      </a>
    </div>

    <div class="auth-heading" style="text-align: center;">
      <span class="eyebrow">Password recovery</span>
      <h2>Forgot your password?</h2>
      <p>Enter your registered student email address to receive a password reset code.</p>
    </div>

    <form id="form-forgot-password" novalidate>
      <div class="field" style="margin-bottom: 16px;">
        <label class="field-label" for="recovery-identifier">Student Email Address</label>
        <input type="email" id="recovery-identifier" placeholder="e.g. name@student.oauife.edu.ng" required autofocus>
        <div class="field-message"></div>
      </div>

      <button type="submit" class="button button-primary full" id="btn-forgot-submit">
        Send Reset Code
      </button>
    </form>

    <div class="portal-link">
      Remembered your password? <a href="auth.html" class="text-button">Return to Sign In</a>
    </div>
  </div>

  <script type="module" src="../assets/js/student/password-recovery.js"></script>
</body>
</html>
