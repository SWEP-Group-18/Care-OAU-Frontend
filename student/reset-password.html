<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care-OAU | Set New Password</title>
  <meta name="description" content="Set a new password for your Care-OAU Student Portal account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="auth-page-centered">

  <div class="auth-card compact">
    <div style="display: flex; justify-content: center; margin-bottom: 12px;">
      <a href="../index.html" class="logo" style="text-decoration: none;">
        <span class="logo-mark">
          <img src="../assets/images/oau-logo.png" alt="Obafemi Awolowo University logo" class="brand-crest-img">
        </span>
        <span>
          <strong>Care-OAU</strong>
          <small>Your Health. Your Time. Our Care.</small>
        </span>
      </a>
    </div>

    <div class="auth-heading" style="text-align: center;">
      <span class="eyebrow">Password recovery</span>
      <h2>Create new password</h2>
      <p>Choose a secure password of at least 6 characters.</p>
    </div>

    <form id="form-reset-password" novalidate>
      <div class="field" style="margin-bottom: 14px;">
        <label class="field-label" for="reset-code">Reset Code (OTP)</label>
        <input type="text" id="reset-code" placeholder="Enter 6-digit code from your email" required autofocus>
        <div class="field-message"></div>
      </div>

      <div class="field" style="margin-bottom: 14px;">
        <label class="field-label" for="reset-password">New Password</label>
        <div class="input-wrap">
          <input type="password" id="reset-password" placeholder="At least 6 characters" required>
          <button type="button" class="input-action" data-toggle-password="reset-password" aria-label="Show password" title="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="field-message"></div>
      </div>

      <div class="field" style="margin-bottom: 18px;">
        <label class="field-label" for="reset-confirm-password">Confirm New Password</label>
        <div class="input-wrap">
          <input type="password" id="reset-confirm-password" placeholder="Repeat new password" required>
          <button type="button" class="input-action" data-toggle-password="reset-confirm-password" aria-label="Show password" title="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="field-message"></div>
      </div>

      <button type="submit" class="button button-primary full" id="btn-reset-submit">
        Save New Password & Sign In
      </button>
    </form>

    <div class="portal-link">
      Never mind? <a href="auth.html" class="text-button">Back to Sign In</a>
    </div>
  </div>

  <script type="module" src="../assets/js/student/password-recovery.js"></script>
</body>
</html>
