<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care-OAU | Set New Password</title>
  <meta name="description" content="Set a new password for your Care-OAU Student Portal account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="auth-page-centered">

  <div class="auth-card compact">
    <div style="display: flex; justify-content: center; margin-bottom: 12px;">
      <a href="../index.html" class="logo" style="text-decoration: none;">
        <span class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true" class="brand-symbol">
            <path d="M27.5 11.5a11 11 0 1 0 0 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 20h4l2.1-4 3.2 8 2.1-4H30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>
          <strong>Care-OAU</strong>
          <small>Your Health. Your Time. Our Care.</small>
        </span>
      </a>
    </div>

    <div class="auth-heading" style="text-align: center;">
      <span class="eyebrow">Password recovery</span>
      <h2>Create new password</h2>
      <p>Choose a secure password of at least 6 characters.</p>
    </div>

    <form id="form-reset-password" novalidate>
      <div class="field" style="margin-bottom: 14px;">
        <label class="field-label" for="reset-password">New Password</label>
        <input type="password" id="reset-password" placeholder="At least 6 characters" required autofocus>
        <div class="field-message"></div>
      </div>

      <div class="field" style="margin-bottom: 18px;">
        <label class="field-label" for="reset-confirm-password">Confirm New Password</label>
        <input type="password" id="reset-confirm-password" placeholder="Repeat new password" required>
        <div class="field-message"></div>
      </div>

      <button type="submit" class="button button-primary full" id="btn-reset-submit">
        Save New Password & Sign In
      </button>
    </form>

    <div class="portal-link">
      Never mind? <a href="auth.html" class="text-button">Back to Sign In</a>
    </div>
  </div>

  <script type="module" src="../assets/js/student/password-recovery.js"></script>
</body>
</html>
