<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments | Care-OAU</title>
  <meta name="description" content="View and manage your health centre appointment history, pending reviews and consultation statuses.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layouts.css">
  <link rel="stylesheet" href="../assets/css/student.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/finishing.css">
</head>
<body class="app-layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" role="navigation" aria-label="Student Navigation"></aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <header class="top-header"></header>

    <main class="content-container">
      
      <!-- PAGE HEADER -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
        <div>
          <h2 class="h2">My Appointments</h2>
          <p class="text-sm text-secondary">
            Monitor status updates, pending clinic approvals, and hospital check-in eligibility.
          </p>
        </div>
        <a href="book-appointment.html" class="btn btn-teal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Book Appointment
        </a>
      </div>

      <!-- STATUS FILTER TABS -->
      <div class="tab-filters" id="appointment-status-tabs">
        <button type="button" class="tab-filter-btn active" data-filter="all">Upcoming</button>
        <button type="button" class="tab-filter-btn" data-filter="Completed">Past</button>
        <button type="button" class="tab-filter-btn" data-filter="Cancelled">Cancelled / Rejected</button>
      </div>

      <div id="appointments-tbody" aria-live="polite"></div>
    </main>
  </div>

  <script type="module" src="../assets/js/student/appointments.js"></script>
</body>
</html>
